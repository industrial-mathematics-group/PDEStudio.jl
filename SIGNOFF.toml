# AI declarations of the files, checked by aisignoff (migrated from aidecl and from format version 1).
# Scheme: https://github.com/industrial-mathematics-group/.github/blob/main/.github/CONTRIBUTING.md#ai-assisted-contributions
version = 4


# Line by line: the commit that landed a line on main declares it. For a pull request into main that is its
# merge commit, whose message is the PR description with the ticked AI declaration of the template. Lines
# whose commit declares nothing keep the file-level declarations of the annotations below.
[history]
default-branch = "main"
merge-method = "merge"

[[annotations]]
path = "**"
AI-Generation = "G3"
Human-Review = "H1"
Reviewed-by = "blhackslash <dev@blackslash.win>"
Assisted-by = "Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"
AI-Review = "A1"
AI-Reviewed-by = "Claude Opus 5.5 (Anthropic), new sessions without the generating conversation (reviews/)"

[[annotations]]
path = "src/**"
AI-Generation = "G2"
Assisted-by = "Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"
Human-Review = "H2"
