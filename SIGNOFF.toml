# The file lists below stay until SIGNOFF.snapshot.json holds the levels they give: `aisignoff freeze` on main
# after the next "Main dev" merge, then the lists are deleted. Their review levels are already the
# attestations at the end of this file; generation, and reviews below the folder defaults, can't be attested.

# Changed on claude/agent-feedback by Claude (issues found with the agent API: particle lines, statistic hints, the
# order of studio_set!, value and label formatting, long titles of compared methods; reviewed in reviews/).
[[annotations]]
path = ["src/AgentAPI.jl", "src/PDEStudio.jl", "src/PlottingLogic.jl", "src/PlottingUtils.jl", "src/ConfigIO.jl", "src/Controls.jl", "src/Presets.jl", "src/UILogic.jl"]
AI-Generation = "G3"
Human-Review = "H1"
AI-Review = "A1"
Assisted-by = ["Claude (Anthropic), claude-opus-5-5"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation (reviews/)"]
Reviewed-by = ["blhackslash <dev@blackslash.win>"]

